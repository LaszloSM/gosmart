name: gosmart
description: GoSmart — Universal transport card with AI for smart cities.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Payments
  flutter_stripe: ^10.1.1

  # NFC
  flutter_nfc_kit: ^3.4.0

  # QR
  qr_flutter: ^4.1.0

  # UI & fonts
  google_fonts: ^6.2.1

  # UUID for idempotency keys
  uuid: ^4.3.3

  # Maps — OpenStreetMap via flutter_map (no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

  # Geolocation
  geolocator: ^13.0.0

  # HTTP client (Groq AI + Mapbox Directions REST calls)
  http: ^1.2.0

  # Utilities
  intl: ^0.20.2

  # Onboarding state persistence
  shared_preferences: ^2.2.2

  # Image picker (profile photo upload)
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
    - .env
