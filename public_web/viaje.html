<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Viaje compartido · GoSmart</title>
<style>
  /* Fuentes del repo (assets/fonts), copiadas a fonts/ al publicar. */
  @font-face { font-family: Barlow; font-weight: 400; src: url(fonts/Barlow-Regular.ttf); font-display: swap; }
  @font-face { font-family: Barlow; font-weight: 600; src: url(fonts/Barlow-SemiBold.ttf); font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url(fonts/BarlowCondensed-Bold.ttf); font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; src: url(fonts/BarlowCondensed-ExtraBold.ttf); font-display: swap; }
  /* Mundo "Rótulo de colectivo" (DESIGN.md): carrocería ultramar, placa blanca. */
  :root { --shell:#1B3A8C; --on-shell:#FFFFFF; --bg:#EEF1F5; --surface:#FFFFFF;
          --brand:#1B3A8C; --text:#141A28; --muted:#454E63; --line:#C9D0DC; --stripe:#C2185B; }
  @media (prefers-color-scheme: dark) {
    :root { --shell:#14295F; --bg:#0E1320; --surface:#171E2D; --brand:#9DB2F2;
            --text:#EEF1F5; --muted:#AEB7CA; --line:#2E3850; --stripe:#FF6FA3; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; background:var(--bg); color:var(--text);
         font: 17px/1.45 Barlow, "Roboto", system-ui, sans-serif; }
  header { background:var(--shell); color:var(--on-shell); padding:20px 16px; }
  header h1 { margin:0; font: 800 28px/1.1 "Barlow Condensed", "Roboto Condensed", sans-serif; }
  main { padding:16px; max-width:560px; margin:0 auto; }
  .plate { background:var(--surface); border:1.5px solid var(--line); border-radius:8px;
           padding:16px; border-bottom:4px solid var(--stripe); }
  .plate .dest { font: 800 26px/1.1 "Barlow Condensed", "Roboto Condensed", sans-serif;
                 color:var(--brand); text-transform:uppercase; margin:0; }
  .plate .detail { color:var(--muted); margin-top:4px; }
  .num { font-variant-numeric: tabular-nums; }
  a.btn { display:block; text-align:center; margin-top:16px; min-height:48px; line-height:48px;
          background:var(--brand); color:var(--surface); border-radius:8px; text-decoration:none;
          font: 700 18px/48px "Barlow Condensed", "Roboto Condensed", sans-serif; letter-spacing:.02em; }
  p.note { color:var(--muted); font-size:15px; }
  .call { color:var(--brand); font-weight:600; }
</style>
</head>
<body>
<header><h1 id="title">Viaje compartido</h1></header>
<main>
  <div class="plate" id="plate" hidden>
    <p class="dest" id="dest"></p>
    <div class="detail" id="detail"></div>
  </div>
  <a class="btn" id="map" hidden target="_blank" rel="noopener">Ver en Google Maps</a>
  <p class="note" id="status">Cargando…</p>
  <p class="note">Si crees que está en peligro, llama al <a class="call" href="tel:123">123</a>.</p>
</main>
<script src="config.js"></script>
<script>
(function () {
  var cfg = window.GOSMART || {};
  var token = (location.hash.match(/t=([0-9a-f]{32,})/) || [])[1];
  var $ = function (id) { return document.getElementById(id); };

  function ago(iso) {
    if (!iso) return null;
    var min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 1) return 'hace menos de un minuto';
    if (min === 1) return 'hace 1 minuto';
    if (min < 60) return 'hace ' + min + ' minutos';
    return 'hace más de una hora';
  }
  function clock(iso) {
    var d = new Date(iso), h = d.getHours() % 12 || 12, m = ('0' + d.getMinutes()).slice(-2);
    return h + ':' + m + (d.getHours() < 12 ? ' a. m.' : ' p. m.');
  }

  function render(v) {
    if (!v) { $('status').textContent = 'Este link no existe o está mal copiado.'; return; }
    var who = v.first_name || 'Alguien';
    $('title').textContent = who + ' comparte su viaje';
    $('plate').hidden = false;
    $('dest').textContent = v.destination_label || 'Destino sin nombre';
    $('detail').textContent = v.mode_label ? 'En ' + v.mode_label : '';
    if (v.state === 'stopped') { $('map').hidden = true; $('status').textContent = who + ' dejó de compartir este viaje.'; return; }
    if (v.state === 'expired') { $('map').hidden = true; $('status').textContent = 'Este link venció a las ' + clock(v.expires_at); return; }
    if (v.last_lat != null && v.last_lng != null) {
      $('map').href = 'https://maps.google.com/?q=' + v.last_lat + ',' + v.last_lng;
      $('map').hidden = false;
      $('status').innerHTML = '';
      $('status').append('Última ubicación ', Object.assign(document.createElement('span'),
        { className: 'num', textContent: ago(v.last_seen_at) }), '. Link activo hasta las ' + clock(v.expires_at));
    } else {
      $('map').hidden = true;
      $('status').textContent = 'Todavía no llega una ubicación. Link activo hasta las ' + clock(v.expires_at);
    }
  }

  function load() {
    if (!token) { $('status').textContent = 'Falta el código del viaje en el link.'; return; }
    if (!cfg.supabaseUrl) { $('status').textContent = 'Página sin configurar.'; return; }
    fetch(cfg.supabaseUrl + '/rest/v1/rpc/trip_share_view', {
      method: 'POST',
      headers: { 'apikey': cfg.supabaseAnonKey, 'Authorization': 'Bearer ' + cfg.supabaseAnonKey,
                 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token })
    }).then(function (r) { if (!r.ok) throw r; return r.json(); })
      .then(function (rows) { render(rows[0]); })
      .catch(function () { $('status').textContent = 'Sin conexión. Reintentamos en un minuto.'; });
  }
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
