name: Android emulator (demo)

# Corre la app en un Android virtual (Google APIs, con Play services) contra el
# Supabase real y con la llave de Google Maps de los secrets, recorre la demo
# (integration_test/demo_flow_test.dart) y sube una captura por paso como
# artifact "emulator-shots". Es la prueba de que el mapa de Google se dibuja.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'lib/**'
      - 'android/**'
      - 'integration_test/**'
      - 'pubspec.yaml'
      - 'tool/ci_env.sh'
      - 'tool/emulator_demo.sh'
      - 'supabase/demo/**'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Demo en emulador
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PROJECT_REF: ndmsiznzvdvpewzkulep
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0  # fija: "latest" consulta la API de GitHub y a veces da límite de peticiones

      - name: Install dependencies
        run: flutter pub get

      - name: .env desde los secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
        run: bash tool/ci_env.sh

      # Datos demo al día (funciones de supabase/demo/demo.sql de este commit) y
      # cuentas en su punto de partida antes de recorrer la app.
      - name: Preparar la demo
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          [ -n "$DB" ] || exit 0
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/demo/demo.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -tAc "select demo_seed('normal')"

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Demo en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tool/emulator_demo.sh

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-shots
          path: shots-named/
          if-no-files-found: ignore
          retention-days: 14

      # La prueba entra como la pasajera demo y deja un viaje: se limpia para
      # que la cuenta quede lista para presentar.
      - name: Dejar la demo limpia
        if: always()
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          [ -n "$DB" ] || exit 0
          psql "$DB" -v ON_ERROR_STOP=1 -q -tAc "select demo_seed('normal')" || echo "::warning::No se pudo limpiar la demo"
