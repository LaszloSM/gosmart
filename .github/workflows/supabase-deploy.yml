name: Supabase deploy

# Todo lo de Supabase con un botón (Actions → Supabase deploy → Run workflow):
#   1. Migraciones: si falta la base (001–007) la crea; luego el paquete 008–018
#      + semilla (supabase/piloto_bundle.sql). Todo es seguro de re-ejecutar.
#   2. Admin: si escribes tu correo, esa cuenta queda como admin.
#   3. Secrets de las Edge Functions: copia los que existan en GitHub.
#   4. Despliega ai-chat, wompi, push, delete-account y maps (Google Places/Routes).
#   5. Webhooks de push (ride_requests y road_reports → función push) si hay
#      PUSH_WEBHOOK_SECRET.
#   6. Demo (opcional, "demo_data"): cuentas pasajero@ / conductor@ / colectivo@example.com
#      con la contraseña del secret DEMO_PASSWORD, datos de ejemplo, conductor
#      automático (pg_cron) y una prueba de punta a punta (tool/e2e_supabase.sh).
#
# Secrets de GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL        cadena "Session pooler" (Connect → Session pooler), con la contraseña.
#                          La conexión directa es solo IPv6 y GitHub no llega a ella.
#   SUPABASE_ACCESS_TOKEN  supabase.com/dashboard/account/tokens
#   GOOGLE_MAPS_SERVER_KEY  clave de Google con Places API (New) y Routes API (si falta,
#                           se usa GOOGLE_MAPS_API_KEY; mejor dos claves, ver docs/PILOTO.md)
#   GROQ_API_KEY, FCM_SERVICE_ACCOUNT, PUSH_WEBHOOK_SECRET,
#   WOMPI_PUBLIC_KEY, WOMPI_INTEGRITY_SECRET, WOMPI_EVENTS_SECRET  (opcionales)
#   DEMO_PASSWORD          contraseña de las cuentas demo (mínimo 8 caracteres)
# Lo que falte se salta con un aviso.

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: 'Correo de la cuenta que será admin (vacío = no tocar)'
        required: false
        default: ''
      demo_data:
        description: 'Cargar datos de demostración y probar todo de punta a punta'
        type: boolean
        default: false
      demo_escenario:
        description: 'Estado de la vía en la demo'
        type: choice
        options: [normal, bloqueo]
        default: normal

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: ndmsiznzvdvpewzkulep

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql 16
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-16

      - name: Migraciones
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB" ]; then echo "::warning::Falta SUPABASE_DB_URL; migraciones omitidas."; exit 0; fi
          psql() { /usr/lib/postgresql/16/bin/psql "$DB" -v ON_ERROR_STOP=1 -q "$@"; }
          if ! err=$(psql -tAc 'select 1' 2>&1); then
            echo "::error::No se pudo entrar a la base. Revisa SUPABASE_DB_URL: cadena del Session pooler (usuario postgres.$PROJECT_REF), sin [YOUR-PASSWORD] y con la contraseña real; si la contraseña tiene @ # / % : ? o espacios, cámbiala en Supabase por una solo de letras y números. Detalle: $(echo "$err" | tail -1)"
            exit 1
          fi
          if [ "$(psql -tAc "select to_regclass('public.profiles') is null")" = "t" ]; then
            echo "Base vacía: aplicando 001–007."
            for f in supabase/migrations/00{1,2,3,4,5,6,7}_*.sql; do echo "→ $f"; psql -f "$f"; done
          fi
          bash tool/bundle_migrations.sh | diff -q - supabase/piloto_bundle.sql
          echo "→ supabase/piloto_bundle.sql (008–018 + semilla)"
          psql -f supabase/piloto_bundle.sql
          echo "Tablas nuevas:"
          psql -tAc "select string_agg(t, ', ') from unnest(array['wallets','drivers','places','road_segments','graph_edges','ride_requests','leg_payments','ride_ratings','push_tokens']) t where to_regclass('public.'||t) is not null"
          psql -tAc "select 'lugares: '||count(*) from places"
          psql -tAc "select 'bucket driver-docs: '||case when to_regclass('storage.buckets') is null then 'sin storage' when exists(select 1 from storage.buckets where id='driver-docs') then 'ok' else 'FALTA' end"

      - name: Admin
        if: inputs.admin_email != ''
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          EMAIL: ${{ inputs.admin_email }}
        run: |
          n=$(/usr/lib/postgresql/16/bin/psql "$DB" -v ON_ERROR_STOP=1 -tA -v email="$EMAIL" <<'SQL'
          WITH u AS (
            UPDATE profiles p SET role = 'admin'
            FROM auth.users a
            WHERE a.id = p.id AND lower(a.email) = lower(:'email')
            RETURNING p.id)
          SELECT count(*) FROM u;
          SQL
          )
          if [ "$n" = "1" ]; then echo "Admin listo."; else
            echo "::error::No hay una cuenta con ese correo. Regístrate primero en la app y vuelve a correr."; exit 1; fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Secrets de las Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_EVENTS_SECRET: ${{ secrets.WOMPI_EVENTS_SECRET }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY || secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::Falta SUPABASE_ACCESS_TOKEN; secrets y funciones omitidos."; exit 0; fi
          if ! supabase projects list >/dev/null 2>&1; then
            echo "::error::SUPABASE_ACCESS_TOKEN no sirve (vencido o revocado). Crea otro en supabase.com/dashboard/account/tokens y reemplaza el secret."
            exit 1
          fi
          args=()
          for k in GROQ_API_KEY GOOGLE_MAPS_SERVER_KEY PUSH_WEBHOOK_SECRET WOMPI_PUBLIC_KEY WOMPI_INTEGRITY_SECRET WOMPI_EVENTS_SECRET; do
            if [ -n "${!k}" ]; then args+=("$k=${!k}"); else echo "($k no está en GitHub; se deja como esté)"; fi
          done
          # El JSON de Firebase va en una sola línea.
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then args+=("FCM_SERVICE_ACCOUNT=$(printf '%s' "$FCM_SERVICE_ACCOUNT" | jq -c .)"); fi
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"; fi
          supabase secrets list --project-ref "$PROJECT_REF"

      - name: Elegir modelos de Groq
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then echo "::warning::Falta GROQ_API_KEY: el asistente no responderá."; exit 0; fi
          models=$(curl -s https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY")
          ids=$(echo "$models" | jq -r '.data[]?.id' | sort)
          [ -n "$ids" ] || { echo "::error::Groq no devolvió modelos: $(echo "$models" | jq -r '.error.message // .' | head -c 200)"; exit 1; }
          echo "Modelos de Groq disponibles:"; echo "$ids" | sed 's/^/  /'
          # Preferencia: rápidos y buenos con herramientas primero.
          pick() { for m in "$@"; do echo "$ids" | grep -qx "$m" && { echo "$m"; return; }; done; }
          prim=$(pick openai/gpt-oss-20b llama-3.1-8b-instant meta-llama/llama-4-scout-17b-16e-instruct qwen/qwen3-32b openai/gpt-oss-120b llama-3.3-70b-versatile)
          fall=$(pick openai/gpt-oss-120b llama-3.3-70b-versatile moonshotai/kimi-k2-instruct qwen/qwen3-32b meta-llama/llama-4-maverick-17b-128e-instruct "$prim")
          [ -n "$prim" ] || prim=$(echo "$ids" | grep -viE 'whisper|guard|tts|playai|orpheus|prompt' | head -1)
          [ -n "$fall" ] || fall=$prim
          for m in "$prim" "$fall"; do
            r=$(curl -s -w '\n%{http_code}' https://api.groq.com/openai/v1/chat/completions \
              -H "Authorization: Bearer $GROQ_API_KEY" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg m "$m" '{model:$m,messages:[{role:"user",content:"Di hola"}],max_tokens:20}')")
            echo "Prueba $m: HTTP ${r##*$'\n'}"
          done
          echo "Asistente: GROQ_MODEL=$prim, GROQ_FALLBACK_MODEL=$fall"
          supabase secrets set --project-ref "$PROJECT_REF" "GROQ_MODEL=$prim" "GROQ_FALLBACK_MODEL=$fall"

      - name: Desplegar Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then exit 0; fi
          # El CLI busca las funciones en supabase/functions.
          mkdir -p supabase/functions && cp -r backend/functions/* supabase/functions/
          [ -f supabase/config.toml ] || echo 'project_id = "gosmart"' > supabase/config.toml
          deploy() { supabase functions deploy "$@" --project-ref "$PROJECT_REF" --use-api; }
          deploy ai-chat --no-verify-jwt
          deploy wompi --no-verify-jwt      # el webhook de Wompi no trae JWT
          deploy push --no-verify-jwt       # el webhook trae x-webhook-secret
          deploy delete-account
          deploy maps                       # con JWT: el anon key de la app basta

      - name: Webhooks de push
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
        run: |
          if [ -z "$DB" ] || [ -z "$PUSH_WEBHOOK_SECRET" ]; then echo "Sin PUSH_WEBHOOK_SECRET: webhooks omitidos."; exit 0; fi
          /usr/lib/postgresql/16/bin/psql "$DB" -v ON_ERROR_STOP=1 -q \
            -v url="https://$PROJECT_REF.supabase.co/functions/v1/push" -v secret="$PUSH_WEBHOOK_SECRET" \
            -f supabase/push_webhooks.sql
          echo "Webhooks de push listos."

      - name: Cuentas demo
        if: inputs.demo_data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Falta SUPABASE_ACCESS_TOKEN"; exit 1; fi
          if [ ${#DEMO_PASSWORD} -lt 8 ]; then
            echo "::error::Falta el secret DEMO_PASSWORD (mínimo 8 caracteres): Settings → Secrets → Actions."; exit 1
          fi
          SR=$({ supabase projects api-keys --project-ref "$PROJECT_REF" --reveal -o json 2>/dev/null || supabase projects api-keys --project-ref "$PROJECT_REF" -o json; } | jq -r '[.[] | select(.name == "service_role")][0].api_key // empty')
          [ -n "$SR" ] || { echo "::error::No se pudo leer la service_role key"; exit 1; }
          echo "::add-mask::$SR"
          U="https://$PROJECT_REF.supabase.co"
          users=$(curl -s "$U/auth/v1/admin/users?per_page=1000" -H "apikey: $SR" -H "Authorization: Bearer $SR")
          for pair in "pasajero:Yeinis Epiayú" "conductor:Wilmer Uriana" "colectivo:Rafael Pushaina"; do
            email="${pair%%:*}@example.com"; name="${pair#*:}"
            id=$(echo "$users" | jq -r --arg e "$email" '.users[]? | select(.email == $e) | .id' | head -1)
            body=$(jq -n --arg e "$email" --arg p "$DEMO_PASSWORD" --arg n "$name" \
              '{email:$e, password:$p, email_confirm:true, user_metadata:{name:$n}}')
            if [ -z "$id" ]; then
              code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST "$U/auth/v1/admin/users" \
                -H "apikey: $SR" -H "Authorization: Bearer $SR" -H 'Content-Type: application/json' -d "$body")
              echo "$email: creada (HTTP $code)"
            else
              code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X PUT "$U/auth/v1/admin/users/$id" \
                -H "apikey: $SR" -H "Authorization: Bearer $SR" -H 'Content-Type: application/json' -d "$body")
              echo "$email: ya existía, contraseña al día (HTTP $code)"
            fi
            [ "$code" -lt 300 ] || { echo "::error::$email: $(jq -r '.msg // .message // .error_description // .' /tmp/r.json | head -c 200)"; exit 1; }
          done

      - name: Datos de demo y conductor automático
        id: seed
        if: inputs.demo_data
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          ESCENARIO: ${{ inputs.demo_escenario }}
        run: |
          psql() { /usr/lib/postgresql/16/bin/psql "$DB" -v ON_ERROR_STOP=1 -q "$@"; }
          psql -f supabase/demo/demo.sql
          psql -tAc "select demo_seed('$ESCENARIO')"
          psql -tAc "select 'pg_cron: ' || coalesce((select schedule from cron.job where jobname = 'gosmart-demo-driver'), 'SIN PROGRAMAR')" \
            || echo "::warning::pg_cron no está; el conductor de demo no avanzará solo."

      - name: Prueba de punta a punta
        if: inputs.demo_data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          export SUPABASE_URL="https://$PROJECT_REF.supabase.co"
          SUPABASE_ANON_KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          [ -n "$SUPABASE_ANON_KEY" ] || SUPABASE_ANON_KEY=$({ supabase projects api-keys --project-ref "$PROJECT_REF" --reveal -o json 2>/dev/null || supabase projects api-keys --project-ref "$PROJECT_REF" -o json; } | jq -r '[.[] | select(.name == "anon")][0].api_key // empty')
          echo "::add-mask::$SUPABASE_ANON_KEY"; export SUPABASE_ANON_KEY
          bash tool/e2e_supabase.sh

      - name: Dejar la demo limpia otra vez
        if: always() && inputs.demo_data && steps.seed.outcome == 'success'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          ESCENARIO: ${{ inputs.demo_escenario }}
        run: |
          /usr/lib/postgresql/16/bin/psql "$DB" -v ON_ERROR_STOP=1 -q -tAc "select demo_seed('$ESCENARIO')"
