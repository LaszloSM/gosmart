name: Supabase deploy

# Todo lo de Supabase con un botón (Actions → Supabase deploy → Run workflow):
#   1. Migraciones: si falta la base (001–007) la crea; luego el paquete 008–018
#      + semilla (supabase/piloto_bundle.sql). Todo es seguro de re-ejecutar.
#   2. Admin: si escribes tu correo, esa cuenta queda como admin.
#   3. Secrets de las Edge Functions: copia los que existan en GitHub.
#   4. Despliega ai-chat, wompi, push y delete-account.
#   5. Webhooks de push (ride_requests y road_reports → función push) si hay
#      PUSH_WEBHOOK_SECRET.
#
# Secrets de GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL        cadena "Session pooler" (Connect → Session pooler), con la contraseña.
#                          La conexión directa es solo IPv6 y GitHub no llega a ella.
#   SUPABASE_ACCESS_TOKEN  supabase.com/dashboard/account/tokens
#   GROQ_API_KEY, FCM_SERVICE_ACCOUNT, PUSH_WEBHOOK_SECRET,
#   WOMPI_PUBLIC_KEY, WOMPI_INTEGRITY_SECRET, WOMPI_EVENTS_SECRET  (opcionales)
# Lo que falte se salta con un aviso.

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: 'Correo de la cuenta que será admin (vacío = no tocar)'
        required: false
        default: ''

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: ndmsiznzvdvpewzkulep

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql 16
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-16

      - name: Migraciones
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB" ]; then echo "::warning::Falta SUPABASE_DB_URL; migraciones omitidas."; exit 0; fi
          psql() { /usr/lib/postgresql/16/bin/psql "$DB" -v ON_ERROR_STOP=1 -q "$@"; }
          if ! err=$(psql -tAc 'select 1' 2>&1); then
            echo "::error::No se pudo entrar a la base. Revisa SUPABASE_DB_URL: cadena del Session pooler (usuario postgres.$PROJECT_REF), sin [YOUR-PASSWORD] y con la contraseña real; si la contraseña tiene @ # / % : ? o espacios, cámbiala en Supabase por una solo de letras y números. Detalle: $(echo "$err" | tail -1)"
            exit 1
          fi
          if [ "$(psql -tAc "select to_regclass('public.profiles') is null")" = "t" ]; then
            echo "Base vacía: aplicando 001–007."
            for f in supabase/migrations/00{1,2,3,4,5,6,7}_*.sql; do echo "→ $f"; psql -f "$f"; done
          fi
          bash tool/bundle_migrations.sh | diff -q - supabase/piloto_bundle.sql
          echo "→ supabase/piloto_bundle.sql (008–018 + semilla)"
          psql -f supabase/piloto_bundle.sql
          echo "Tablas nuevas:"
          psql -tAc "select string_agg(t, ', ') from unnest(array['wallets','drivers','places','road_segments','graph_edges','ride_requests','leg_payments','ride_ratings','push_tokens']) t where to_regclass('public.'||t) is not null"
          psql -tAc "select 'lugares: '||count(*) from places"
          psql -tAc "select 'bucket driver-docs: '||case when to_regclass('storage.buckets') is null then 'sin storage' when exists(select 1 from storage.buckets where id='driver-docs') then 'ok' else 'FALTA' end"

      - name: Admin
        if: inputs.admin_email != ''
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          EMAIL: ${{ inputs.admin_email }}
        run: |
          n=$(/usr/lib/postgresql/16/bin/psql "$DB" -v ON_ERROR_STOP=1 -tA -v email="$EMAIL" <<'SQL'
          WITH u AS (
            UPDATE profiles p SET role = 'admin'
            FROM auth.users a
            WHERE a.id = p.id AND lower(a.email) = lower(:'email')
            RETURNING p.id)
          SELECT count(*) FROM u;
          SQL
          )
          if [ "$n" = "1" ]; then echo "Admin listo."; else
            echo "::error::No hay una cuenta con ese correo. Regístrate primero en la app y vuelve a correr."; exit 1; fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Secrets de las Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
          WOMPI_PUBLIC_KEY: ${{ secrets.WOMPI_PUBLIC_KEY }}
          WOMPI_INTEGRITY_SECRET: ${{ secrets.WOMPI_INTEGRITY_SECRET }}
          WOMPI_EVENTS_SECRET: ${{ secrets.WOMPI_EVENTS_SECRET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::Falta SUPABASE_ACCESS_TOKEN; secrets y funciones omitidos."; exit 0; fi
          args=()
          for k in GROQ_API_KEY PUSH_WEBHOOK_SECRET WOMPI_PUBLIC_KEY WOMPI_INTEGRITY_SECRET WOMPI_EVENTS_SECRET; do
            if [ -n "${!k}" ]; then args+=("$k=${!k}"); else echo "($k no está en GitHub; se deja como esté)"; fi
          done
          # El JSON de Firebase va en una sola línea.
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then args+=("FCM_SERVICE_ACCOUNT=$(printf '%s' "$FCM_SERVICE_ACCOUNT" | jq -c .)"); fi
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"; fi
          supabase secrets list --project-ref "$PROJECT_REF"

      - name: Desplegar Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then exit 0; fi
          # El CLI busca las funciones en supabase/functions.
          mkdir -p supabase/functions && cp -r backend/functions/* supabase/functions/
          [ -f supabase/config.toml ] || echo 'project_id = "gosmart"' > supabase/config.toml
          deploy() { supabase functions deploy "$@" --project-ref "$PROJECT_REF" --use-api; }
          deploy ai-chat --no-verify-jwt
          deploy wompi --no-verify-jwt      # el webhook de Wompi no trae JWT
          deploy push --no-verify-jwt       # el webhook trae x-webhook-secret
          deploy delete-account

      - name: Webhooks de push
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
        run: |
          if [ -z "$DB" ] || [ -z "$PUSH_WEBHOOK_SECRET" ]; then echo "Sin PUSH_WEBHOOK_SECRET: webhooks omitidos."; exit 0; fi
          /usr/lib/postgresql/16/bin/psql "$DB" -v ON_ERROR_STOP=1 -q \
            -v url="https://$PROJECT_REF.supabase.co/functions/v1/push" -v secret="$PUSH_WEBHOOK_SECRET" \
            -f supabase/push_webhooks.sql
          echo "Webhooks de push listos."
