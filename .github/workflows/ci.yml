name: GoSmart CI

on:
  push:
    # También las ramas de trabajo, para ver el APK compilar antes del PR.
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env (placeholder values)
        run: cp .env.example .env

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  test:
    name: Tests (flutter test)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env (placeholder values)
        run: cp .env.example .env

      - name: Run tests
        run: flutter test --no-pub

  sql-tests:
    name: SQL tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Run migration tests
        run: |
          set -e
          psql -v ON_ERROR_STOP=1 -q -c 'create database gosmart_test'
          for f in supabase/tests/_supabase_stub.sql \
                   supabase/migrations/008_wallet_mock.sql \
                   supabase/migrations/010_wallet_hardening.sql \
                   supabase/tests/010_wallet_hardening_test.sql; do
            psql -d gosmart_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
          # 011+ en una base aparte: profiles sale de un fixture (001 pide PostGIS)
          psql -v ON_ERROR_STOP=1 -q -c 'create database gosmart_core'
          for f in supabase/tests/_supabase_stub.sql \
                   supabase/tests/_profiles_fixture.sql \
                   supabase/migrations/011_roles_safety.sql \
                   supabase/migrations/011_roles_safety.sql \
                   supabase/migrations/012_places_directory.sql \
                   supabase/migrations/012_places_directory.sql \
                   supabase/seed/places_seed.sql \
                   supabase/migrations/013_corridor.sql \
                   supabase/migrations/013_corridor.sql \
                   supabase/tests/011_roles_safety_test.sql \
                   supabase/tests/012_places_directory_test.sql \
                   supabase/tests/013_corridor_test.sql; do
            psql -d gosmart_core -v ON_ERROR_STOP=1 -q -f "$f"
          done

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test and type-check ai-chat
        working-directory: backend/functions/ai-chat
        run: |
          deno test normalizer_test.ts
          deno check index.ts

  build-android:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env (placeholder values)
        run: cp .env.example .env

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gosmart-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
