name: GoSmart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  test:
    name: Tests (flutter test)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env for tests
        run: |
          echo "SUPABASE_URL=https://placeholder.supabase.co" >> .env
          echo "SUPABASE_ANON_KEY=placeholder-anon-key" >> .env
          echo "STRIPE_PUBLISHABLE_KEY=pk_test_placeholder" >> .env
          echo "GOOGLE_MAPS_API_KEY=placeholder" >> .env

      - name: Run tests
        run: flutter test --no-pub

  build-android:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env for build
        run: |
          echo "SUPABASE_URL=https://placeholder.supabase.co" >> .env
          echo "SUPABASE_ANON_KEY=placeholder-anon-key" >> .env
          echo "STRIPE_PUBLISHABLE_KEY=pk_test_placeholder" >> .env
          echo "GOOGLE_MAPS_API_KEY=placeholder" >> .env

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gosmart-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
