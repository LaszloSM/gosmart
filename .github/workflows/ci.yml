name: GoSmart CI

on:
  push:
    # También las ramas de trabajo, para ver el APK compilar antes del PR.
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Un push nuevo en la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (flutter analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env (placeholder values)
        run: cp .env.example .env

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  test:
    name: Tests (flutter test)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env (placeholder values)
        run: cp .env.example .env

      - name: Run tests
        run: flutter test --no-pub

  sql-tests:
    name: SQL tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Run migration tests
        run: |
          set -e
          psql -v ON_ERROR_STOP=1 -q -c 'create database gosmart_test'
          for f in supabase/tests/_supabase_stub.sql \
                   supabase/migrations/008_wallet_mock.sql \
                   supabase/migrations/010_wallet_hardening.sql \
                   supabase/tests/010_wallet_hardening_test.sql; do
            psql -d gosmart_test -v ON_ERROR_STOP=1 -q -f "$f"
          done
          # 011+ en una base aparte: profiles sale de un fixture (001 pide PostGIS)
          psql -v ON_ERROR_STOP=1 -q -c 'create database gosmart_core'
          run() { psql -d gosmart_core -v ON_ERROR_STOP=1 -q -f "$1"; }
          run supabase/tests/_supabase_stub.sql
          run supabase/tests/_profiles_fixture.sql
          run supabase/migrations/008_wallet_mock.sql
          run supabase/migrations/010_wallet_hardening.sql
          # Cada migración dos veces: deben ser seguras de re-ejecutar.
          for m in 011_roles_safety 012_places_directory 013_corridor 019_signup_fix \
                   014_transport_graph 015_dispatch 016_payments 017_trust_admin 018_push 020_fares; do
            run "supabase/migrations/$m.sql"
            run "supabase/migrations/$m.sql"
          done
          run supabase/seed/places_seed.sql
          # Y la secuencia completa otra vez (lo que se pega en el SQL Editor):
          # el paquete debe estar al día y aguantar re-ejecución sobre todo lo anterior.
          bash tool/bundle_migrations.sh | diff -q - supabase/piloto_bundle.sql
          run supabase/piloto_bundle.sql
          for t in 011_roles_safety 012_places_directory 013_corridor \
                   014_transport_graph 015_dispatch; do
            run "supabase/tests/${t}_test.sql"
          done
          # D7: dos conexiones a la vez compiten por el mismo viaje y el último cupo
          bash supabase/tests/015_race_test.sh gosmart_core
          run supabase/tests/016_payments_test.sql
          run supabase/tests/017_trust_admin_test.sql
          run supabase/tests/018_push_test.sql
          # Datos de demo y conductor automático (sin pg_cron aquí: se llama el tick a mano)
          run supabase/demo/demo.sql
          run supabase/demo/demo.sql
          run supabase/tests/019_demo_test.sql

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test and type-check ai-chat
        working-directory: backend/functions/ai-chat
        run: |
          deno test normalizer_test.ts tools_test.ts
          deno check index.ts

      - name: Test and type-check wompi
        working-directory: backend/functions/wompi
        run: |
          deno test signing_test.ts
          deno check index.ts

      - name: Test and type-check push
        working-directory: backend/functions/push
        run: |
          deno test fcm_test.ts
          deno check index.ts

      - name: Test and type-check maps
        working-directory: backend/functions/maps
        run: |
          deno test google_test.ts
          deno check index.ts

  build-android:
    name: Build APK (Android)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Con los secrets del repo el APK sale conectado a tu Supabase, con mapa y push.
      # SUPABASE_URL / SUPABASE_ANON_KEY: si no están como secrets, se sacan del
      # proyecto con SUPABASE_ACCESS_TOKEN (el anon key es público: va en el APK).
      - name: Create .env and google-services.json from secrets
        env:
          PROJECT_REF: ndmsiznzvdvpewzkulep
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
          SHARE_BASE_URL: ${{ secrets.SHARE_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash tool/ci_env.sh

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gosmart-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
